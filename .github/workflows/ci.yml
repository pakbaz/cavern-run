name: CI

# Every push and every pull request gets the same treatment: type-check, run
# the suite, and prove the game still bundles. Pushes to main that pass then
# publish to GitHub Pages, so the playable build can never be ahead of a green
# test run.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # `npm run build` type-checks before it bundles, so this covers both.
      - name: Build
        run: npm run build

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Deploys queue rather than cancel: a half-published site is worse than a
    # slightly stale one.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
