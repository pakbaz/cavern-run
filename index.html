<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <meta
      name="description"
      content="Cavern Run - 20 caves, one way out. Dig, dodge falling boulders and haul out the gems before the clock runs dry."
    />
    <title>Cavern Run &mdash; 20 Caves. One Way Out.</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        font-family: 'Courier New', ui-monospace, monospace;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 38%, #16233b 0%, #090e1a 55%, #04060b 100%);
      }

      #game-root canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }

      /* Boot splash, removed once Phaser paints its first frame. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        color: #cfe4ff;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font-size: clamp(0.7rem, 2vw, 1rem);
        background: #05070d;
        transition: opacity 420ms ease;
        z-index: 10;
      }

      #boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-splash .boot-title {
        font-size: clamp(1.6rem, 6vw, 3.2rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        background: linear-gradient(180deg, #eef6ff 0%, #9fc4ee 48%, #f08a2a 52%, #d24b18 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      #boot-splash .boot-bar {
        width: min(280px, 60vw);
        height: 4px;
        border-radius: 2px;
        background: #14203a;
        overflow: hidden;
      }

      #boot-splash .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #38d0ff, #7ef0ff);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-bar::after {
          animation: none;
          width: 100%;
        }
      }

      noscript {
        color: #ffb4a1;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="game-root" aria-label="Cavern Run game canvas" role="application"></div>

    <div id="boot-splash">
      <div class="boot-title">Cavern Run</div>
      <div class="boot-bar"></div>
      <div>Carving the caves&hellip;</div>
    </div>

    <noscript>Cavern Run needs JavaScript enabled to run.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
